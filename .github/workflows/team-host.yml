name: Poikas team-room host setup
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        description: Bounded Poikas service operation
        options: [inspect, configure, verify, enable]
        default: inspect
      expected_marker:
        type: string
        description: Persistence fingerprint from configure (required for verify/enable)
permissions:
  contents: read
concurrency:
  group: poikas-team-host
  cancel-in-progress: false
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Trust the existing deployment host
        env:
          REMOTE_HOST: ${{ secrets.CUSTOM_REMOTE_SERVER }}
        run: ssh-keyscan -p 22 "$REMOTE_HOST" >> ~/.ssh/known_hosts
      - name: Run the bounded Poikas operation
        env:
          CUSTOM_REMOTE_URL: ${{ secrets.CUSTOM_REMOTE_URL }}
          POIKAS_TEAM_ADMIN_PASSWORD: ${{ secrets.POIKAS_TEAM_ADMIN_PASSWORD }}
          EXPECTED_MARKER: ${{ inputs.expected_marker }}
          HOST_ACTION: ${{ inputs.action }}
        run: python3 scripts/team-host.py "$HOST_ACTION"
